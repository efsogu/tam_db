  function sourceFor(c,field){const docs=c.source_registry?.documents||{};if(field?.source_document_id&&docs[field.source_document_id])return docs[field.source_document_id];const vals=Object.values(docs);return vals.length===1?vals[0]:null}
  function metrics(){const benchmarked=DB.cases.filter(c=>c.acceptance?.stage_a_precision_gate!=="NOT_BENCHMARKED");const stagePass=benchmarked.filter(c=>c.acceptance?.stage_a_precision_gate==="PASS");const fullPass=benchmarked.filter(c=>c.acceptance?.full_75_field_acceptance==="PASS");const pending=DB.cases.reduce((a,c)=>a+(c.review_queue?.length||0),0);const candidates=DB.cases.filter(isManual).length;return{benchmarked,stagePass,fullPass,pending,candidates}}
  function renderHeader(){const m=metrics(),h=document.querySelector('.header-actions');if(h)h.innerHTML=`<span class="chip ok">Stage-A ${m.stagePass.length}/${m.benchmarked.length} PASS</span><span class="chip warn">Full-75 ${m.fullPass.length}/${m.benchmarked.length}</span>${m.candidates?`<span class="chip warn">${m.candidates} manual candidate</span>`:''}`}
  function renderNav(){$('#nav').innerHTML=navItems.map(([id,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state={view:b.dataset.nav,caseId:null,tab:'fields'};render()})}
  function setHead(t,s){$('#title').textContent=t;$('#subtitle').textContent=s}
  function coverageLabel(c){return isManual(c)?`Manual visual review 75/75 · engine ${esc(c.acceptance.stage_a_precision_gate||'NOT_BENCHMARKED')}`:`${coverage(c)}% · required ${reqCoverage(c)}%`}

  function dashboard(){const m=metrics();setHead('Kontrol Merkezi','Bakım anlaşmaları analiz durumunu tek bakışta izle.');return `<div class="grid kpis"><div class="card kpi"><span class="muted small">Anlaşma / case</span><strong>${DB.cases.length}</strong><span class="small muted">${m.benchmarked.length} benchmarked · ${m.candidates} candidate</span></div><div class="card kpi"><span class="muted small">Stage-A precision</span><strong>${m.stagePass.length}/${m.benchmarked.length}</strong><span class="small muted">Yalnız engine benchmarked case'ler</span></div><div class="card kpi"><span class="muted small">Pending review</span><strong>${m.pending}</strong><span class="small muted">Human publish kararı bekliyor</span></div><div class="card kpi"><span class="muted small">Full-75 acceptance</span><strong>${m.fullPass.length}/${m.benchmarked.length}</strong><span class="small muted">Manual candidate acceptance sayılmaz</span></div></div><div class="section-title"><h2>Anlaşmalar</h2><button class="btn secondary" data-go="agreements">Tümünü gör</button></div>${agreementsTable(DB.cases)}<div class="section-title"><h2>Coverage / doğrulama</h2></div><div class="grid two">${DB.cases.map(c=>`<div class="card"><b>${esc(c.institution)}</b><div class="small muted" style="margin:6px 0">${coverageLabel(c)}</div><div class="bar"><span style="width:${isManual(c)?100:reqCoverage(c)}%"></span></div><div class="small muted" style="margin-top:7px">${isManual(c)?'Manual visual extraction; engine Stage-A henüz çalıştırılmadı.':`Required unknown: ${c.acceptance.required_unknown_count??'—'} · observed: ${c.acceptance.observed_field_count??'—'}/75`}</div></div>`).join('')}</div>`}
  function agreementsTable(list){return `<div class="table-wrap"><table><thead><tr><th>Kurum</th><th>Şehir</th><th>Yıl</th><th>Dosya No</th><th>Bağlam</th><th>Coverage / Gate</th><th>Review</th><th>Durum</th></tr></thead><tbody>${list.map(c=>`<tr class="clickable" data-case="${esc(c.id)}"><td><b>${esc(c.institution)}</b><div class="small muted">${esc(c.canonical_case_id)}</div></td><td>${esc(c.city||'—')}${c.district?` / ${esc(c.district)}`:''}</td><td>${esc(c.year||'—')}</td><td>${esc(c.tender_file_number||'—')}</td><td>${esc(c.procurement_type||'—')}</td><td>${isManual(c)?'<span class="chip warn">MANUAL · engine bekliyor</span>':`${coverage(c)}% <span class="small muted">(req ${reqCoverage(c)}%)</span>`}</td><td>${c.review_queue.length} pending</td><td>${statusChip(c.analysis_status)}</td></tr>`).join('')}</tbody></table></div>`}
  function agreements(){setHead('Anlaşmalar','Kurum, şehir, yıl, dosya no ve analiz durumuna göre ara.');return `<div class="toolbar"><input id="search" placeholder="Kurum, şehir, dosya no, kapsam ara…"><select id="year"><option value="">Tüm yıllar</option>${[...new Set(DB.cases.map(c=>c.year).filter(Boolean))].sort().map(y=>`<option>${esc(y)}</option>`).join('')}</select></div><div id="agreementTable">${agreementsTable(DB.cases)}</div>`}
  function detail(c){setHead(c.institution,`${c.city||''}${c.district?' / '+c.district:''} · ${c.year||''} · ${c.canonical_case_id}`);const folder=c.source_registry?.case_folder;return `<div class="hero"><div class="card"><div class="detail-meta"><div class="metric"><span class="small muted">Dosya / teklif son</span><b>${esc(c.tender_file_number||'—')} · ${esc(c.bid_deadline||'—')}</b></div><div class="metric"><span class="small muted">Cihaz</span><b>${c.devices.length}</b></div><div class="metric"><span class="small muted">${isManual(c)?'Doğrulama':'Required coverage'}</span><b>${isManual(c)?'MANUAL':reqCoverage(c)+'%'}</b></div></div><p class="small muted" style="margin-top:14px">${esc(c.procurement_type||'')} · ${isManual(c)?'Engine Stage-A NOT_BENCHMARKED':'Engine Stage-A '+esc(c.acceptance.stage_a_precision_gate||'—')}</p></div><div class="card"><b>Kaynaklar</b><p class="small muted">${esc(folder?.title||'')}</p>${folder?.url?`<a class="source-link" target="_blank" rel="noreferrer" href="${esc(folder.url)}">Şartname klasörünü aç ↗</a>`:''}${c.gold_folder?.url?`<p><a class="source-link" target="_blank" rel="noreferrer" href="${esc(c.gold_folder.url)}">Candidate Gold klasörünü aç ↗</a></p>`:''}</div></div><div class="tabs">${[['fields','75 Alan'],['devices','Cihazlar'],['review','Review'],['docs','Kaynaklar']].map(([id,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${l}</button>`).join('')}</div><div id="detailTab">${detailTab(c)}</div>`}
  function detailTab(c){if(state.tab==='devices')return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Marka / Model</th><th>Seri No</th><th>Künye No</th><th>Konfigürasyon</th><th>Profil</th></tr></thead><tbody>${c.devices.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.brand||d.manufacturer||'—')} ${esc(d.model||d.device_model||'')}</td><td>${esc(d.serial_number||d.serial_no||'—')}</td><td>${esc(d.asset_number||d.asset_no||'—')}</td><td>${esc(d.configuration||'—')}</td><td>${esc(d.service_profile_id||d.profile_id||'—')}</td></tr>`).join('')}</tbody></table></div>`;if(state.tab==='review')return reviewTable(c.review_queue,c,true);if(state.tab==='docs'){const docs=c.source_registry?.documents||{};return `<div class="grid">${Object.entries(docs).map(([id,d])=>`<div class="card"><b>${esc(d.title)}</b><div class="small muted">${esc(id)} · ${esc(d.link_kind||'SOURCE')}</div><p><a class="source-link" href="${esc(d.url)}" target="_blank" rel="noreferrer">Kaynağı aç ↗</a></p></div>`).join('')}</div>`}return `<div class="toolbar"><input id="fieldSearch" placeholder="Alan ara: uptime, PM, flow sensör, yedek parça…"><select id="fieldStatus"><option value="">Tüm durumlar</option><option>FOUND</option><option>AMBIGUOUS</option><option>NOT_FOUND</option><option>CONFLICT</option></select></div><div id="fieldsTable">${fieldsTable(c,c.fields)}</div>`}
  function fieldsTable(c,fields){return `<div class="table-wrap"><table><thead><tr><th>Alan</th><th>Değer</th><th>Durum</th><th>Kaynak / Madde</th><th>Kanıt</th></tr></thead><tbody>${fields.map(f=>{const s=sourceFor(c,f);return `<tr><td><b>${esc(f.field_label)}</b><div class="small muted">${esc(f.field_key)}</div></td><td>${esc(fmt(f.normalized_value))}${f.unit?` <span class="small muted">${esc(f.unit)}</span>`:''}</td><td>${statusChip(f.extraction_status)}</td><td>${s?`<a class="source-link" target="_blank" rel="noreferrer" href="${esc(s.url)}">${esc(s.title)}</a>`:'—'}<div class="small muted">${f.source_page!==null&&f.source_page!==undefined?'s.'+esc(f.source_page):''}${f.source_clause?' · '+esc(f.source_clause):''}</div></td><td class="evidence">${esc(f.source_text_short||'—')}</td></tr>`}).join('')}</tbody></table></div>`}
  function reviewTable(items,contextCase,showSingle=false){return `<div class="notice"><b>Review gate:</b> Bu pilotta karar yazma kapalı; kalıcı DB bağlanmadan APPROVE/CORRECT/COMMIT yapılmaz.</div><div class="table-wrap"><table><thead><tr>${showSingle?'':'<th>Kurum</th>'}<th>Alan</th><th>Değer</th><th>Neden</th><th>Kaynak / Kanıt</th><th>Durum</th></tr></thead><tbody>${items.map(i=>{const c=i._case||contextCase;const f=c?.fields?.find(x=>x.field_key===i.field_key);const src=c?sourceFor(c,f||i):null;return `<tr>${showSingle?'':`<td><b>${esc(c?.institution||'—')}</b></td>`}<td><b>${esc(i.field_key)}</b></td><td>${esc(fmt(i.normalized_value))} ${esc(i.unit||'')}</td><td>${esc(i.reason||'')}</td><td class="evidence">${src?`<a class="source-link" href="${esc(src.url)}" target="_blank" rel="noreferrer">Kaynağı aç ↗</a><br>`:''}${i.source_page!=null?'s.'+esc(i.source_page)+' · ':''}${esc(i.source_clause||'')}<div class="small muted">${esc(i.source_text_short||'')}</div></td><td>${statusChip(i.extraction_status)}</td></tr>`}).join('')}</tbody></table></div>`}
  const synonyms={'uptime':['uptime','calisma suresi','çalışma süresi','kullanilabilirlik'],'yedek parca':['yedek parça','parca dahil','spare'],'flow sensor':['flow sensor','flow sensör','flow sensoru','flow sensörü'],'pm kit':['pm kit','bakim kit','bakım kit'],'onarim':['onarım','onarim','repair','ariza giderim'],'mudahale':['müdahale','mudahale','response'],'odeme':['ödeme','odeme','payment'],'ceza':['ceza','penalty'],'yetki':['yetki','yetkili servis','authorization'],'sarf':['sarf','consumable'],'bakim':['bakım','bakim','pm'],'sozlesme suresi':['sözleşme süresi','sozlesme suresi','contract duration']};
  function ask(){setHead('Sor / Ask','Kaynak bağlantılı deterministik soru-cevap.');return `<div class="ask"><div class="notice"><b>Pilot query engine:</b> Yanıtlar yalnız canonical alanlar ve kayıtlı source evidence üzerinden üretilir; kaynakta olmayan bilgi tahmin edilmez.</div><textarea id="question" placeholder="Örn: Bilkent flow sensörü dahil mi?"></textarea><div class="ask-examples"><button>Bilkent flow sensörü dahil mi?</button><button>Hangi anlaşmalarda uptime %95?</button><button>Bilkent'te yurtdışı parça süresi kaç gün?</button><button>Parça dahil olan sözleşmeleri göster</button></div><button class="btn" id="askBtn">Kaynaklarda ara</button><div id="answer" class="answer"></div></div>`}
  function query(q){const nq=norm(q);let selected=DB.cases.filter(c=>[c.institution,c.city,c.district,c.tender_file_number].some(v=>v&&nq.includes(norm(v).split(' ')[0])));if(!selected.length)selected=DB.cases;let terms=nq.split(' ').filter(x=>x.length>2);for(const[k,vals]of Object.entries(synonyms))if(vals.some(v=>nq.includes(norm(v))))terms.push(...norm(k).split(' '),...vals.flatMap(v=>norm(v).split(' ')));const hits=[];selected.forEach(c=>{const searchable=[...(c.quick_facts||[]),...c.fields];searchable.forEach(f=>{const hay=norm([f.field_label,f.field_key,fmt(f.normalized_value),f.source_clause,f.source_text_short].join(' '));let score=terms.reduce((a,t)=>a+(hay.includes(t)?1:0),0);if(String(f.field_key||'').startsWith('item.'))score+=10;if(score>=Math.max(1,Math.min(2,terms.length)))hits.push({c,f,score,s:sourceFor(c,f)})})});hits.sort((a,b)=>b.score-a.score);return hits.slice(0,14)}
  function renderAnswer(q){const hits=query(q),el=$('#answer');if(!hits.length){el.innerHTML='<div class="card"><b>Kanıtlı eşleşme bulunamadı.</b><p class="small muted">Kaynakta olmayan bilgiyi üretmedim.</p></div>';return}el.innerHTML=hits.map(h=>`<div class="card"><h3>${esc(h.c.institution)} · ${esc(h.f.field_label)}</h3><div>${statusChip(h.f.extraction_status)} <b style="margin-left:7px">${esc(fmt(h.f.normalized_value))}</b> ${esc(h.f.unit||'')}</div><p class="small muted">${h.f.source_page!=null?'s.'+esc(h.f.source_page)+' · ':''}${esc(h.f.source_clause||'')}</p><p class="small">${esc(h.f.source_text_short||'')}</p>${h.s?`<a class="source-link" href="${esc(h.s.url)}" target="_blank" rel="noreferrer">Kaynağı aç ↗</a>`:''}</div>`).join('')}
  function review(){const all=DB.cases.flatMap(c=>c.review_queue.map(x=>({...x,_case:c})));setHead('Review Center',`${all.length} pending review kaydını kurum ve kaynak kanıtıyla görüntüle.`);return reviewTable(all,null,false)}
  function inbox(){setHead('Drive Inbox','Şartname kaynak klasörlerinin snapshot durumu.');return `<div class="notice"><b>Canlı otomatik sync henüz bağlı değil.</b> Bu ekran bilinen kaynak klasörlerini gösterir. Production sync için Drive watcher/scheduled intake + kalıcı DB gate'i açık.</div><div class="grid">${DB.cases.map(c=>`<div class="card"><b>${esc(c.source_registry?.case_folder?.title||c.institution)}</b><div class="small muted">${Object.keys(c.source_registry?.documents||{}).length} kaynak dosya · ${esc(c.institution)}</div><p>${c.source_registry?.case_folder?.url?`<a class="source-link" href="${esc(c.source_registry.case_folder.url)}" target="_blank" rel="noreferrer">Drive klasörünü aç ↗</a>`:''}</p></div>`).join('')}</div>`}
  function feedback(){setHead('Feedback','İnsan düzeltmelerini audit edilebilir şekilde öğrenme katmanına aktar.');return `<div class="notice"><b>Persistence gate açık.</b> Kalıcı PostgreSQL/Supabase bağlı olmadığı için bu pilotta feedback yazma kapalıdır; bu bilinçli veri bütünlüğü korumasıdır.</div><div class="grid two"><div class="card"><b>Hedef akış</b><p class="small muted">Tespit → düzeltme önerisi → kaynak kanıtı → kullanıcı onayı → staging → mutabakat → audit / rollback.</p></div><div class="card"><b>Mevcut durum</b><p class="small muted">CASE_005 dahil tüm pending review kararları yalnız görüntülenir; kullanıcı kararı oluşmadan Gold/Published kabul edilmez.</p></div></div>`}
  function audit(){setHead('Export & Audit','Kanıt, acceptance ve export görünümü.');const m=metrics();return `<div class="grid two"><div class="card"><b>Acceptance / validation</b><p class="small muted">Engine benchmarked: ${m.benchmarked.length}; Stage-A PASS: ${m.stagePass.length}; manual candidate: ${m.candidates}.</p>${DB.cases.map(c=>`<div style="margin:10px 0"><b>${esc(c.id)}</b> · ${isManual(c)?'MANUAL 75/75 · engine NOT_BENCHMARKED':`${c.acceptance.exact_match_count??'—'}/${c.acceptance.observed_field_count??'—'} exact · ${coverage(c)}% coverage`}</div>`).join('')}</div><div class="card"><b>Export</b><p class="small muted">Candidate Gold/Excel artefactları Drive Gold Set klasörlerinde tutulur. Operational publish yalnız human review + persistent backend sonrasında açılacaktır.</p></div></div>`}
  function render(){renderNav();renderHeader();let html='';if(state.caseId)html=detail(caseById(state.caseId));else if(state.view==='dashboard')html=dashboard();else if(state.view==='agreements')html=agreements();else if(state.view==='ask')html=ask();else if(state.view==='review')html=review();else if(state.view==='inbox')html=inbox();else if(state.view==='feedback')html=feedback();else html=audit();$('#app').innerHTML=html;bind()}
  function bind(){document.querySelectorAll('[data-case]').forEach(r=>r.onclick=()=>{state.caseId=r.dataset.case;state.tab='fields';render()});const go=$('[data-go]');if(go)go.onclick=()=>{state.view=go.dataset.go;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;$('#detailTab').innerHTML=detailTab(caseById(state.caseId));bind()});const s=$('#search'),y=$('#year');if(s||y){const update=()=>{const q=norm(s?.value||''),yr=y?.value;const l=DB.cases.filter(c=>(!yr||String(c.year)===yr)&&(!q||norm([c.institution,c.city,c.district,c.tender_file_number,c.procurement_type].join(' ')).includes(q)));$('#agreementTable').innerHTML=agreementsTable(l);document.querySelectorAll('[data-case]').forEach(r=>r.onclick=()=>{state.caseId=r.dataset.case;state.tab='fields';render()})};if(s)s.oninput=update;if(y)y.onchange=update}const fs=$('#fieldSearch'),fst=$('#fieldStatus');if(fs||fst){const up=()=>{const c=caseById(state.caseId),q=norm(fs?.value||''),st=fst?.value;const f=c.fields.filter(x=>(!st||x.extraction_status===st)&&(!q||norm([x.field_label,x.field_key,fmt(x.normalized_value),x.source_text_short].join(' ')).includes(q)));$('#fieldsTable').innerHTML=fieldsTable(c,f)};if(fs)fs.oninput=up;if(fst)fst.onchange=up}const a=$('#askBtn');if(a)a.onclick=()=>renderAnswer($('#question').value);document.querySelectorAll('.ask-examples button').forEach(b=>b.onclick=()=>{$('#question').value=b.textContent;renderAnswer(b.textContent)})}
  window.__PRJ026_DEBUG__={DB,metrics,query,hydrateCase};
  render();
})();</script></body></html>
