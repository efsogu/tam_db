/batch benchmark approved","2.2.17","Sistem çalışma düzeni resmi tatil hariç olmak üzere günde 9 saat ve haftada 5 gün kesintisiz şekilde olacaktır."],["scope.spare_parts_inclusion","Dahil",null,"AMBIGUOUS","AMBIGUOUS","2.2.18","... yalnız parça dahil periyodik bakımları ve onarım hizmetini kapsar."],["qualification.privacy_kvkk_cybersecurity_conditions","Hasta güvenliği ve bilgi gizliliğine riayet",null,"FOUND","model vision route requires human review until provider/batch benchmark approved","2.2.20","Hasta güvenliği ve bilgi gizliliğine riayet edilecektir."],["penalty.general_trigger_calculation_basis","Süreler içinde hizmet gerçekleşmezse idare başka firmaya yaptırabilir; masraf yükleniciden tahsil/hakedişten kesilir",null,"FOUND","model vision route requires human review until provider/batch benchmark approved","2.2.14","Hizmetin ... süreler içinde gerçekleştirilememesi halinde idare işi başka bir firmaya yaptırabilme hakkı kazanacaktır. O"],["commercial.payment_required_documents_conditions","Yetkili birim onaylı servis formu sonrası ödeme",null,"FOUND","model vision route requires human review until provider/batch benchmark approved","2.2.11","Bakım yapıldığına dair servis formlarının onayı hastane yetkili birimi tarafından yapılacak ve ödeme bu onaydan sonra ge"]],"devices":[{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"},{"brand":"GE"}]}]};</script><script>const navItems=[['dashboard','Kontrol Merkezi'],['agreements','Anlaşmalar'],['ask','Sor / Ask'],['review','Review Center'],['inbox','Drive Inbox'],['audit','Export & Audit']];
let DB={cases:[]}; let state={view:'dashboard',caseId:null,tab:'fields'};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function caseById(id){return DB.cases.find(c=>c.id===id)}
function coverage(c){return Math.round((c.acceptance.coverage_ratio||0)*100)}

function renderNav(){ $('#nav').innerHTML=navItems.map(([id,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${label}</button>`).join(''); document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state={view:b.dataset.nav,caseId:null,tab:'fields'}; render();}); }
function sourceFor(c,field){const docs=c.source_registry?.documents||{}; return docs[field.source_document_id]||null}

function dashboard(){setHead('Kontrol Merkezi','Bakım anlaşmaları analiz durumunu tek bakışta izle.'); const totalPending=DB.cases.reduce((a,c)=>a+c.review_queue.length,0); return `<div class="grid kpis">

<div class="card kpi"><span class="muted small">Stage-A precision</span><strong>4/4</strong><span class="small muted">%100 exact observed fields</span></div>
<div class="card kpi"><span class="muted small">Pending review</span><strong>${totalPending}</strong><span class="small muted">Gerçek insan kararı: 0</span></div>
<div class="card kpi"><span class="muted small">Full-75 acceptance</span><strong>0/4</strong><span class="small muted">Coverage expansion gerekli</span></div></div>
<div class="section-title"><h2>Anlaşmalar</h2><button class="btn secondary" data-go="agreements">Tümünü gör</button></div>${agreementsTable(DB.cases)}

function agreementsTable(list){return `<div class="table-wrap"><table><thead><tr><th>Kurum</th><th>Şehir</th><th>Yıl</th><th>Bağlam</th><th>Coverage</th><th>Review</th><th>Durum</th></tr></thead><tbody>${list.map(c=>`<tr class="clickable" data-case="${c.id}"><td><b>${esc(c.institution)}</b><div class="small muted">${esc(c.canonical_case_id)}</div></td><td>${esc(c.city||'—')}${c.district?` / ${esc(c.district)}`:''}</td><td>${c.year||'—'}</td><td>${esc(c.procurement_type||'—')}</td><td>${coverage(c)}% <span class="small muted">(req ${reqCoverage(c)}%)</span></td><td>${c.review_queue.length} pending</td><td>${statusChip(c.analysis_status)}</td></tr>`).join('')}</tbody></table></div>`}
function agreements(){setHead('Anlaşmalar','Kurum, şehir, yıl ve analiz durumuna göre ara.'); return `<div class="toolbar"><input id="search" placeholder="Kurum, şehir, ihale no ara…"><select id="year"><option value="">Tüm yıllar</option><option>2026</option><option>2027</option></select></div><div id="agreementTable">${agreementsTable(DB.cases)}</div>`}
function detail(c){setHead(c.institution,`${c.city||''}${c.district?' / '+c.district:''} · ${c.year||''} · ${c.canonical_case_id}`); const folder=c.source_registry?.case_folder; return `<div class="hero"><div class="card"><div class="detail-meta"><div class="metric"><span class="small muted">Teklif / takip</span><b>${esc(c.tender_file_number||c.bid_deadline||'—')}</b></div><div class="metric"><span class="small muted">Cihaz</span><b>${c.devices.length}</b></div><div class="metric"><span class="small muted">Required coverage</span><b>${reqCoverage(c)}%</b></div></div><p class="small muted" style="margin-top:14px">${esc(c.procurement_type||'')}</p></div><div class="card"><b>Kaynak klasör</b><p class="small muted">${esc(folder?.title||'')}</p>${folder?.url?`<a class="source-link" target="_blank" rel="noreferrer" href="${esc(folder.url)}">Google Drive klasörünü aç ↗</a>`:''}</div></div>
<div class="tabs">${[['fields','75 Alan'],['devices','Cihazlar'],['review','Review'],['docs','Kaynaklar']].map(([id,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${l}</button>`).join('')}</div><div id="detailTab">${detailTab(c)}</div>`}
function detailTab(c){if(state.tab==='devices') return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Marka/Model</th><th>Seri No</th><th>Profil</th></tr></thead><tbody>${c.devices.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.brand||d.manufacturer||'GE')} ${esc(d.model||d.device_model||'')}</td><td>${esc(d.serial_number||d.serial_no||'—')}</td><td>${esc(d.service_profile_id||d.profile_id||'—')}</td></tr>`).join('')}</tbody></table></div>`;
if(state.tab==='review') return reviewTable(c.review_queue,c);
if(state.tab==='docs'){const docs=c.source_registry?.documents||{};return `<div class="grid">${Object.entries(docs).map(([id,d])=>`<div class="card"><b>${esc(d.title)}</b><div class="small muted">${esc(id)} · ${esc(d.link_kind)}</div><p><a class="source-link" href="${esc(d.url)}" target="_blank" rel="noreferrer">Kaynağı aç ↗</a></p></div>`).join('')}</div>`}
return `<div class="toolbar"><input id="fieldSearch" placeholder="Alan ara: uptime, PM, yedek parça…"><select id="fieldStatus"><option value="">Tüm durumlar</option><option>FOUND</option><option>AMBIGUOUS</option><option>NOT_FOUND</option><option>CONFLICT</option></select></div><div id="fieldsTable">${fieldsTable(c,c.fields)}</div>`}
function fieldsTable(c,fields){return `<div class="table-wrap"><table><thead><tr><th>Alan</th><th>Değer</th><th>Durum</th><th>Kaynak / Madde</th><th>Kanıt</th></tr></thead><tbody>${fields.map(f=>{const s=sourceFor(c,f);return `<tr><td><b>${esc(f.field_label)}</b><div class="small muted">${esc(f.field_key)}</div></td><td>${esc(fmt(f.normalized_value))}${f.unit?` <span class="small muted">${esc(f.unit)}</span>`:''}</td><td>${statusChip(f.extraction_status)}</td><td>${s?`<a class="source-link" target="_blank" rel="noreferrer" href="${esc(s.url)}">${esc(s.title)}</a>`:'—'}<div class="small muted">${esc(f.source_page||'')} ${f.source_clause?'· '+esc(f.source_clause):''}</div></td><td class="evidence">${esc(f.source_text_short||'—')}</td></tr>`}).join('')}</tbody></table></div>`}
function reviewTable(items,c){return `<div class="notice"><b>Read-only pilot:</b> Review kararları gösteriliyor ancak kalıcı DB bağlanana kadar APPROVE/CORRECT/COMMIT kapalı.</div><div class="table-wrap"><table><thead><tr><th>Alan</th><th>Değer</th><th>Neden</th><th>Kanıt</th><th>Durum</th></tr></thead><tbody>${items.map(i=>`<tr><td><b>${esc(i.field_key)}</b></td><td>${esc(fmt(i.normalized_value))} ${esc(i.unit||'')}</td><td>${esc(i.reason||'')}</td><td class="evidence">${esc(i.source_clause||'')}<div class="small muted">${esc(i.source_text_short||'')}</div></td><td>${statusChip(i.extraction_status)}</td></tr>`).join('')}</tbody></table></div>`}
const synonyms={
'uptime':['uptime','calisma suresi','çalışma süresi','kullanilabilirlik'], 'yedek parca':['yedek parça','parca dahil','spare'], 'pm kit':['pm kit','bakim kit','bakım kit'], 'onarim':['onarım','onarim','repair','ariza giderim'], 'mudahale':['müdahale','mudahale','response'], 'odeme':['ödeme','odeme','payment'], 'ceza':['ceza','penalty'], 'yetki':['yetki','yetkili servis','authorization'], 'sarf':['sarf','consumable'], 'bakim':['bakım','bakim','pm'], 'sozlesme suresi':['sözleşme süresi','sozlesme suresi','contract duration']};
function ask(){setHead('Sor / Ask','Kaynak bağlantılı deterministik soru-cevap.'); return `<div class="ask"><div class="notice"><b>Pilot query engine:</b> Yanıtlar yalnız canonical alanlar ve kayıtlı source evidence üzerinden üretilir; kaynakta olmayan bilgi tahmin edilmez.</div><textarea id="question" placeholder="Örn: Hangi anlaşmalarda uptime %95? veya Akdeniz'de PM kit dahil mi?"></textarea><div class="ask-examples"><button>Hangi anlaşmalarda uptime %95?</button><button>Akdeniz'de PM kit dahil mi?</button><button>Silivri'de yurtdışı parça süresi kaç gün?</button><button>Parça dahil olan sözleşmeleri göster</button></div><button class="btn" id="askBtn">Kaynaklarda ara</button><div id="answer" class="answer"></div></div>`}
function query(q){let nq=norm(q); let selected=DB.cases.filter(c=>nq.includes(norm(c.institution).split(' ')[0])||nq.includes(norm(c.city||''))||nq.includes(norm(c.district||''))); if(!selected.length) selected=DB.cases;
let terms=nq.split(' ').filter(x=>x.length>2); for(const [k,vals] of Object.entries(synonyms)){if(vals.some(v=>nq.includes(norm(v)))) terms.push(...norm(k).split(' '),...vals.flatMap(v=>norm(v).split(' ')))}
let hits=[]; selected.forEach(c=>c.fields.forEach(f=>{let hay=norm([f.field_label,f.field_key,fmt(f.normalized_value),f.source_clause,f.source_text_short].join(' ')); let score=terms.reduce((a,t)=>a+(hay.includes(t)?1:0),0); if(score>=Math.max(1,Math.min(2,terms.length))) hits.push({c,f,score,s:sourceFor(c,f)})})); hits.sort((a,b)=>b.score-a.score); return hits.slice(0,12)}
function renderAnswer(q){const hits=query(q), el=$('#answer'); if(!hits.length){el.innerHTML='<div class="card"><b>Kanıtlı eşleşme bulunamadı.</b><p class="small muted">Kaynakta olmayan bilgiyi üretmedim.</p></div>';return} el.innerHTML=hits.map(h=>`<div class="card"><h3>${esc(h.c.institution)} · ${esc(h.f.field_label)}</h3><div>${statusChip(h.f.extraction_status)} <b style="margin-left:7px">${esc(fmt(h.f.normalized_value))}</b> ${esc(h.f.unit||'')}</div><p class="small muted">${esc(h.f.source_clause||'')} ${h.f.source_page?'· s.'+esc(h.f.source_page):''}</p><p class="small">${esc(h.f.source_text_short||'')}</p>${h.s?`<a class="source-link" href="${esc(h.s.url)}" target="_blank" rel="noreferrer">Kaynağı aç ↗</a>`:''}</div>`).join('')}
function review(){setHead('Review Center','32 pending review kaydını kaynak kanıtıyla görüntüle.'); const all=DB.cases.flatMap(c=>c.review_queue.map(x=>({...x,_case:c}))); return reviewTable(all,{})}
function inbox(){setHead('Drive Inbox','Şartnameler kaynak klasörlerinin snapshot durumu.'); return `<div class="notice"><b>Canlı otomatik sync henüz bağlı değil.</b> Bu deploy v0.19 source registry snapshot'ını gösteriyor. Production sync için Drive OAuth/service integration + kalıcı DB gate'i açık.</div><div class="grid">${DB.cases.map(c=>`<div class="card"><b>${esc(c.source_registry.case_folder.title)}</b><div class="small muted">${Object.keys(c.source_registry.documents||{}).length} kaynak dosya · ${esc(c.institution)}</div><p><a class="source-link" href="${esc(c.source_registry.case_folder.url)}" target="_blank" rel="noreferrer">Drive klasörünü aç ↗</a></p></div>`).join('')}</div>`}
function audit(){setHead('Export & Audit','Kanıt, acceptance ve export görünümü.'); return `<div class="grid two"><div class="card"><b>Acceptance</b><p class="small muted">v0.30 fixture-independent Stage-A: 4/4 PASS</p>${DB.cases.map(c=>`<div style="margin:10px 0"><b>${esc(c.id)}</b> · ${c.acceptance.exact_match_count}/${c.acceptance.observed_field_count} exact · ${coverage(c)}% coverage</div>`).join('')}</div><div class="card"><b>Excel / Audit</b><p class="small muted">Canonical Excel export backend artefactı mevcut; bu pilotta indirme endpoint'i bağlanmadı.</p><p class="small">Excel ana kullanım ekranı değildir; yalnız export/audit katmanıdır.</p></div></div>`}
function render(){renderNav(); let html=''; if(state.caseId){html=detail(caseById(state.caseId))}else if(state.view==='dashboard')html=dashboard();else if(state.view==='agreements')html=agreements();else if(state.view==='ask')html=ask();else if(state.view==='review')html=review();else if(state.view==='inbox')html=inbox();else html=audit(); $('#app').innerHTML=html; bind();}
function bind(){document.querySelectorAll('[data-case]').forEach(r=>r.onclick=()=>{state.caseId=r.dataset.case;state.tab='fields';render()}); const go=$('[data-go]'); if(go)go.onclick=()=>{state.view=go.dataset.go;render()}; document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; $('#detailTab').innerHTML=detailTab(caseById(state.caseId)); bind()});
const s=$('#search'), y=$('#year'); if(s||y){const update=()=>{let q=norm(s?.value||''),yr=y?.value;let l=DB.cases.filter(c=>(!yr||String(c.year)===yr)&&(!q||norm([c.institution,c.city,c.district,c.tender_file_number,c.procurement_type].join(' ')).includes(q))); $('#agreementTable').innerHTML=agreementsTable(l); document.querySelectorAll('[data-case]').forEach(r=>r.onclick=()=>{state.caseId=r.dataset.case;render()})}; if(s)s.oninput=update;if(y)y.onchange=update}
const fs=$('#fieldSearch'),fst=$('#fieldStatus'); if(fs||fst){const up=()=>{let c=caseById(state.caseId),q=norm(fs?.value||''),st=fst?.value;let f=c.fields.filter(x=>(!st||x.extraction_status===st)&&(!q||norm([x.field_label,x.field_key,fmt(x.normalized_value)].join(' ')).includes(q)));$('#fieldsTable').innerHTML=fieldsTable(c,f)};if(fs)fs.oninput=up;if(fst)fst.onchange=up}
const a=$('#askBtn'); if(a)a.onclick=()=>renderAnswer($('#question').value); document.querySelectorAll('.ask-examples button').forEach(b=>b.onclick=()=>{$('#question').value=b.textContent;renderAnswer(b.textContent)});}
Promise.resolve(window.__PRJ026_DATA__).then(d=>{DB=d;render()}).catch(e=>{$('#app').innerHTML='<div class="card">Veri yüklenemedi: '+esc(e.message)+'</div>'});
</script></body></html>
